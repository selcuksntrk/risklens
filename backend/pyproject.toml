[project]
name = "risklens"
version = "0.1.0"
description = "Evidence-based screening of visible non-structural earthquake findings (Meta Muse + SAM 3.1)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pillow>=10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=13",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
